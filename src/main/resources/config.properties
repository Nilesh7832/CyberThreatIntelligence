# ============================================
# Cyber Threat Intelligence Framework
# Application Configuration
# ============================================

# Database Settings
db.url=jdbc:sqlite:cti_framework.db
db.name=cti_framework.db

# Threat Detection Thresholds
threat.brute_force.threshold=5
threat.brute_force.window_minutes=10
threat.port_scan.threshold=10
threat.credential_stuffing.threshold=4

# Risk Score Boundaries
risk.critical.threshold=80
risk.high.threshold=60
risk.medium.threshold=40

# ML Model Settings
ml.model.path=models/threat_model.model
ml.training.data.path=src/main/resources/training_data.arff
ml.cross_validation.folds=10
ml.train.split.percent=80

# Report Settings
report.output.path=reports/
report.csv.filename=threat_report.csv
report.pdf.filename=threat_report.pdf

# Dashboard Settings
dashboard.output.path=doc/dashboard.html

# Logging Settings
log.file.path=logs/cti_framework.log
log.level=INFO

# Alert Settings
alert.console.enabled=true
alert.email.enabled=false
alert.email.smtp=smtp.gmail.com
alert.email.port=587
alert.email.from=your@email.com
alert.email.to=admin@company.com

# IP Blacklist
blacklist.file.path=src/main/resources/blacklist.txt
blacklist.auto_block.enabled=true